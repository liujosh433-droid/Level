[project]
name = "level-api"
version = "0.1.0"
description = "Level's FastAPI service. Runs on Cloud Run."
requires-python = ">=3.12"
authors = [{ name = "Level Team" }]
dependencies = [
    "level-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/level_api"]
