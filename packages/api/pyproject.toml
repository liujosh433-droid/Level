[project]
name = "level-api"
version = "2.0.0"
description = "Level FastAPI on Cloud Run"
requires-python = ">=3.12"
dependencies = [
    "level-core",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/level_api"]
