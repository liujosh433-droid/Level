[project]
name = "level-core"
version = "2.0.0"
description = "Level shared domain: agents, calendar, care, schedule, storage"
requires-python = ">=3.12"
dependencies = [
    "pydantic[email]>=2.9",
    "pydantic-settings>=2.5",
    "email-validator>=2.2",
    "google-auth>=2.35",
    "google-auth-oauthlib>=1.2",
    "google-api-python-client>=2.147",
    "google-cloud-firestore>=2.19",
    "google-cloud-storage>=2.18",
    "google-cloud-aiplatform>=1.71",
    "google-genai>=0.3",
    "google-adk>=0.2",
    "opentelemetry-api>=1.28",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-exporter-gcp-trace>=1.7",
    "structlog>=24.4",
    "itsdangerous>=2.2",
    "python-dateutil>=2.9",
    "tzdata>=2024.2",
    "icalendar>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/level_core"]

# Belt-and-suspenders: make sure the demo ICS fixtures (loaded at
# runtime via importlib.resources - see
# level_core.demo.scenarios.ScenarioConfig.ics_path) always land in
# the wheel. Hatchling includes non-.py files under `packages` by
# default, but declaring artifacts explicitly means a broader
# `exclude` pattern added later can't silently strip them and
# reintroduce demo_ics_missing on the deployed API.
artifacts = [
    "src/level_core/demo/data/*.ics",
]
