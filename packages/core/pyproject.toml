[project]
name = "level-core"
version = "0.1.0"
description = "Shared library: agents, memory, models, guardrails, observability."
requires-python = ">=3.12"
authors = [{ name = "Level Team" }]
dependencies = [
    # Data + config
    "pydantic>=2.7",
    "pydantic-settings>=2.4",
    "pyyaml>=6.0",

    # Google agent + AI
    "google-adk>=0.1",
    "google-genai>=0.3",
    "google-cloud-aiplatform>=1.60",

    # Google Cloud infra
    "google-cloud-firestore>=2.16",
    "google-cloud-storage>=2.16",
    "google-cloud-secret-manager>=2.20",
    "google-cloud-logging>=3.10",
    "google-api-python-client>=2.140",
    "google-auth>=2.30",
    "google-auth-oauthlib>=1.2",

    # Observability
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-exporter-gcp-trace>=1.7",
    "opentelemetry-instrumentation-httpx>=0.46b0",
    "structlog>=24.1",

    # HTTP
    "httpx>=0.27",
    "tenacity>=8.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/level_core"]

[tool.hatch.build.targets.wheel.force-include]
"src/level_core/bias/data" = "level_core/bias/data"
