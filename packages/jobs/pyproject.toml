[project]
name = "level-jobs"
version = "2.0.0"
description = "Level Cloud Run Jobs: nightly usual recompute + TTL + watch renew"
requires-python = ">=3.12"
dependencies = [
    "level-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/level_jobs"]
