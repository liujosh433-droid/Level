[project]
name = "level-jobs"
version = "0.1.0"
description = "Level's Cloud Run Jobs: ingestion connectors + async challenge generation."
requires-python = ">=3.12"
authors = [{ name = "Level Team" }]
dependencies = [
    "level-core",
]

[project.scripts]
level-async-challenge = "level_jobs.async_challenge:cli"
level-ingest-all = "level_jobs.ingest_all:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/level_jobs"]
