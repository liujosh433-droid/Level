[project]
name = "level"
version = "2.0.0"
description = "Level - caregiver partner (rebuilt for All Things Agentic hackathon)"
requires-python = ">=3.12"
readme = "README.md"

[tool.uv.workspace]
members = ["packages/core", "packages/api", "packages/jobs"]

[tool.uv.sources]
level-core = { workspace = true }
level-api = { workspace = true }
level-jobs = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-requests>=2.32",
]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "unit: fast in-process tests (LEVEL_ENV=local, no network)",
    "e2e: end-to-end through FastAPI (LEVEL_ENV=local)",
    "security: prompt-injection + auth + Firestore rules",
    "cloud: requires GCP credentials, skipped by default",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "PL"]
ignore = [
    "PLR0911",
    "PLR0912",
    "PLR0913",
    "PLR0915",
    "PLR2004",
    "PLC0415",
    "B008",
    "SIM102",
    "SIM103",
    "SIM108",
    "SIM117",
    "E501",
    "PLR1714",
    "PLW0603",
    "UP046",
]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
files = ["packages"]
