[project]
name = "level"
version = "0.1.0"
description = "Level — a warm-but-honest AI decision partner for busy caregivers."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Level Team" }]

# The root project pulls in every workspace member so `uv sync` at the repo
# root installs everything at once. Individual deployables (api, jobs) declare
# their own runtime deps in their own pyproject.toml.
dependencies = [
    "level-core",
    "level-api",
    "level-jobs",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "pytest-mock>=3.14",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-pyyaml>=6.0",
    "httpx>=0.27",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/api", "packages/core", "packages/jobs"]

[tool.uv.sources]
level-core = { workspace = true }
level-api = { workspace = true }
level-jobs = { workspace = true }

[tool.pytest.ini_options]
minversion = "8.0"
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: end-to-end tests that wire multiple components together",
    "cloud: tests that require real GCP credentials (skipped by default)",
]

[tool.coverage.run]
source = ["packages"]
branch = true
omit = [
    "*/tests/*",
    "*/__init__.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "\\.\\.\\.",
]
show_missing = true
